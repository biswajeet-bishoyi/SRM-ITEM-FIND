[project]
name = "srm-campusfind"
version = "1.0.0"
description = "Intelligent Multimodal Lost-and-Found System using GenAI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "requests>=2.31.0",
    "jinja2>=3.1.2",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.6"
]

[tool.vercel]
entrypoint = "api.index:app"
